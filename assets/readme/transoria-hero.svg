<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Transoria novel translation workspace</title>
  <desc id="desc">A project-themed hero showing EPUB and TXT input flowing through translation and proofreading into finished books.</desc>

  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#2a2823" stroke-width="1"/>
    </pattern>
    <clipPath id="canvas-clip">
      <rect width="1200" height="440" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="440" fill="#151411"/>
    <rect width="1200" height="440" fill="url(#grid)" opacity="0.8"/>
    <circle cx="1142" cy="34" r="116" fill="#25231f"/>
    <circle cx="1104" cy="402" r="138" fill="#1f2621" opacity="0.72"/>

    <g transform="translate(66 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <text x="0" y="0" dominant-baseline="hanging" fill="#a9a196" font-size="18" font-weight="700">
        LOCAL NOVEL TRANSLATION · DESKTOP APP
      </text>
      <rect x="0" y="38" width="58" height="6" rx="3" fill="#62b784"/>

      <text x="0" y="84" dominant-baseline="hanging" fill="#f5f1e8" font-size="66" font-weight="760">
        Transoria
      </text>
      <text x="0" y="164" dominant-baseline="hanging" fill="#ddd5c8" font-size="27" font-weight="620">
        从术语整理到成书输出
      </text>
      <text x="0" y="207" dominant-baseline="hanging" fill="#a9a196" font-size="21">
        Translate, review, and rebuild EPUB / TXT novels locally.
      </text>

      <g transform="translate(0 270)" font-size="17" font-weight="650">
        <rect width="132" height="42" rx="21" fill="#25231f" stroke="#514b42"/>
        <text x="66" y="22" dominant-baseline="middle" text-anchor="middle" fill="#f5f1e8">EPUB / TXT</text>

        <rect x="146" width="126" height="42" rx="21" fill="#25231f" stroke="#514b42"/>
        <text x="209" y="22" dominant-baseline="middle" text-anchor="middle" fill="#f5f1e8">Glossary</text>

        <rect x="286" width="132" height="42" rx="21" fill="#d8c8a8"/>
        <text x="352" y="22" dominant-baseline="middle" text-anchor="middle" fill="#151411">Translate</text>

        <rect x="432" width="126" height="42" rx="21" fill="#25231f" stroke="#514b42"/>
        <text x="495" y="22" dominant-baseline="middle" text-anchor="middle" fill="#f5f1e8">Proofread</text>
      </g>

      <text x="0" y="344" dominant-baseline="hanging" fill="#7f796f" font-size="16" font-weight="650">
        YOUR API KEYS · RESUMABLE TASKS · STRUCTURE-PRESERVING OUTPUT
      </text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <g transform="translate(785 48) rotate(6 150 94)">
        <rect x="8" y="10" width="300" height="188" rx="23" fill="#0b0b0a" opacity="0.34"/>
        <rect width="300" height="188" rx="23" fill="#f3f2ec"/>
        <rect x="26" y="24" width="62" height="6" rx="3" fill="#ad9d7a"/>
        <text x="26" y="53" dominant-baseline="hanging" fill="#3d3530" font-size="18" font-weight="750">SOURCE BOOK</text>
        <rect x="26" y="87" width="78" height="72" rx="12" fill="#3d3530"/>
        <text x="65" y="124" dominant-baseline="middle" text-anchor="middle" fill="#f5f1e8" font-size="18" font-weight="750">EPUB</text>
        <rect x="122" y="91" width="136" height="9" rx="4.5" fill="#ad9d7a"/>
        <rect x="122" y="114" width="112" height="8" rx="4" fill="#c9c1b2"/>
        <rect x="122" y="136" width="126" height="8" rx="4" fill="#c9c1b2"/>
      </g>

      <g transform="translate(700 166) rotate(-5 176 104)">
        <rect x="8" y="11" width="352" height="208" rx="24" fill="#090908" opacity="0.34"/>
        <rect width="352" height="208" rx="24" fill="#d8c8a8"/>
        <text x="26" y="25" dominant-baseline="hanging" fill="#53483f" font-size="18" font-weight="760">TRANSLATION PIPELINE</text>
        <text x="26" y="61" dominant-baseline="hanging" fill="#151411" font-size="27" font-weight="760">Korean → Chinese</text>

        <g transform="translate(26 112)">
          <circle cx="20" cy="20" r="20" fill="#3d3530"/>
          <text x="20" y="21" dominant-baseline="middle" text-anchor="middle" fill="#f5f1e8" font-size="15" font-weight="760">KO</text>
          <path d="M 51 20 H 126" stroke="#7b6c5d" stroke-width="4" stroke-linecap="round"/>
          <circle cx="147" cy="20" r="20" fill="#62b784"/>
          <text x="147" y="21" dominant-baseline="middle" text-anchor="middle" fill="#151411" font-size="15" font-weight="760">AI</text>
          <path d="M 178 20 H 253" stroke="#7b6c5d" stroke-width="4" stroke-linecap="round"/>
          <circle cx="274" cy="20" r="20" fill="#f5f1e8"/>
          <text x="274" y="21" dominant-baseline="middle" text-anchor="middle" fill="#3d3530" font-size="15" font-weight="760">ZH</text>
        </g>

        <rect x="26" y="174" width="300" height="9" rx="4.5" fill="#b8a98c"/>
        <rect x="26" y="174" width="228" height="9" rx="4.5" fill="#2f7d57"/>
      </g>

      <g transform="translate(928 268) rotate(6 118 71)">
        <rect x="7" y="10" width="236" height="142" rx="21" fill="#090908" opacity="0.36"/>
        <rect width="236" height="142" rx="21" fill="#25231f" stroke="#514b42"/>
        <text x="22" y="20" dominant-baseline="hanging" fill="#c8b88e" font-size="17" font-weight="760">PROOFREAD</text>

        <g transform="translate(22 59)" fill="none" stroke-linecap="round">
          <circle cx="10" cy="10" r="9" fill="#62b784" stroke="#62b784"/>
          <path d="M 6 10 L 9 13 L 15 7" stroke="#151411" stroke-width="2.5"/>
          <path d="M 34 10 H 186" stroke="#8e877d" stroke-width="7"/>

          <circle cx="10" cy="48" r="9" fill="#e0a05f" stroke="#e0a05f"/>
          <path d="M 10 4 V 11" stroke="#151411" stroke-width="2.5"/>
          <circle cx="10" cy="15" r="1.5" fill="#151411" stroke="none"/>
          <path d="M 34 48 H 164" stroke="#8e877d" stroke-width="7"/>
        </g>
      </g>
    </g>
  </g>
</svg>
